[project]
name = "memora"
kind = "fullstack"
entry-point = "main.jac"

[run]
diagnostics = "error"

[serve]
base_route_app = "app"

[client]

[jac-shadcn]
style = "maia"
baseColor = "stone"
theme = "emerald"
font = "figtree"
radius = "medium"
menuAccent = "subtle"
menuColor = "default"
[dependencies.npm]
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
"@fontsource-variable/figtree" = "*"
radix-ui = "*"
class-variance-authority = "*"
shadcn = "^3.8.5"
tw-animate-css = "^1.4.0"
tailwind-merge = "^3.5.0"
clsx = "^2.1.1"
react = "^18.2.0"
react-dom = "^18.2.0"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[jacpack]
name = 'Memora_3'
description = 'Jac IDE snapshot for Memora_3'

[jachammer]
project_id = "prj_d93dd8ada4154961b1f3137818c4741f"

[plugins.client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]
